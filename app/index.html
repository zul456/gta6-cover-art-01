<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmline Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Palmline</h1>
    <p class="tag">GTA-style cover art from your own photos. Runs offline, nothing is uploaded.</p>

    <fieldset>
      <legend>Layout</legend>
      <div class="row" id="layoutRow">
        <button data-layout="split" type="button" class="on">Split</button>
        <button data-layout="grid" type="button">Grid</button>
        <button data-layout="bands" type="button">Bands</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <div class="row" id="gradeRow">
        <button data-grade="sunset" type="button" class="on">Sunset</button>
        <button data-grade="neon" type="button">Neon</button>
        <button data-grade="vice" type="button">Vice</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Size</legend>
      <div class="row" id="sizeRow">
        <button data-size="square" type="button" class="on">1080 &times; 1080</button>
        <button data-size="portrait" type="button">1080 &times; 1350</button>
        <button data-size="wide" type="button">1920 &times; 1080</button>
      </div>
    </fieldset>

    <label>Title <input id="title" type="text" maxlength="32" value="Boulevard Nights"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Neon Coast"></label>

    <fieldset>
      <legend>Selected panel</legend>
      <p id="panelLabel">Panel 1 of 3</p>
      <div class="row">
        <button id="loadPhoto" type="button">Load photo&hellip;</button>
        <input id="photoFile" type="file" accept="image/*" hidden>
        <button id="cycleSample" type="button">Sample photo</button>
      </div>
      <div class="row">
        <button id="zoomOut" type="button">&minus; Zoom</button>
        <button id="zoomIn" type="button">+ Zoom</button>
        <button id="resetPanel" type="button">Reset</button>
      </div>
      <p class="hint">Click a panel to select it. Drag to move the photo, scroll to zoom.</p>
    </fieldset>

    <button id="export" type="button" class="primary">Export PNG</button>
    <p id="status" role="status"></p>
  </section>

  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
